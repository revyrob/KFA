# =============================================================================
# Kootenay Festival of the Arts: static site, 2026–27 season
# Domain: https://www.kootenayfestivalofthearts.ca
#
# For Secure by Design: these rules go inside the existing nginx server { }
# block for www.kootenayfestivalofthearts.ca (keep the current HTTPS and
# non-www → www redirects as they are).
#
# ALL REDIRECTS ARE TEMPORARY (302) ON PURPOSE.
# The WordPress site takes this domain back next year and will use these
# old addresses again. Permanent (301) redirects are cached by browsers and
# search engines and would keep sending people away from the restored
# WordPress pages. Please do not change them to 301.
# =============================================================================

# Path to the folder deployed from GitHub (the repo root, containing index.html)
root /PATH/TO/kfota-website;
index index.html;

# -----------------------------------------------------------------------------
# 1. Clean URLs: /genres serves /pages/genres.html (no ".html" in the address)
# -----------------------------------------------------------------------------
location ~ ^/(adjudicators|contact|donations|genres|history|registration|sponsors|volunteers)$ {
    try_files /pages/$1.html =404;
}

# Old-style links to /pages/genres.html → /genres
location ~ ^/pages/([a-z]+)\.html$ {
    return 302 /$1$is_args$args;
}

# Home page is served at / ; /index.html → /
# (try_files serves the file directly, avoiding an index → redirect loop)
location = / {
    try_files /index.html =404;
}
location = /index.html {
    return 302 /;
}

# -----------------------------------------------------------------------------
# 2. Old WordPress pages → new pages
# -----------------------------------------------------------------------------

# About / contact / support
location = /history/                  { return 302 /history; }
location = /contact/                  { return 302 /contact; }
location = /contact-response/         { return 302 /contact; }
location = /volunteer/                { return 302 /volunteers; }
location = /donation/                 { return 302 /donations; }
location = /donation-incomplete/      { return 302 /donations; }
location = /support/                  { return 302 /donations; }
location = /2026-sponsors-nelson/     { return 302 /sponsors; }

# Adjudicators
location = /trails-adjudicators/      { return 302 /adjudicators; }
location = /2024-adjudicators/        { return 302 /adjudicators; }
location = /2026-adjudicators/        { return 302 /adjudicators; }

# Schedule, venues, apparel → home page (Key dates + Venues are in the sidebar)
location = /schedule/                     { return 302 /; }
location = /performance-venues/           { return 302 /; }
location = /festival-hoodies-and-t-shirts/ { return 302 /; }
location = /festival-apparel/             { return 302 /; }

# Genres, categories, syllabus, workshops
location = /festival-categories/      { return 302 /genres; }
location = /workshops/                { return 302 /genres; }
location = /workshops-2025/           { return 302 /genres; }
location = /2023-trail-disciplines/   { return 302 /genres; }
location = /disciplines-2026/         { return 302 /genres; }
location = /trail-syllabus/           { return 302 /genres; }
location = /festival-syllabi/         { return 302 /genres; }
location = /2024-syllabus/            { return 302 /genres; }
location = /2025-syllabus/            { return 302 /genres; }
location = /2026-kootenay-festival-of-the-arts-syllabus/ { return 302 /genres; }
location = /vocal-arts-workshop/      { return 302 "/genres#voiceSpeechArts"; }
location = /vocal-workshop-2026/      { return 302 "/genres#voiceSpeechArts"; }

# Discipline pages → matching section of /genres
location = /dance-trail/                    { return 302 "/genres#dance"; }
location = /dance-2026/                     { return 302 "/genres#dance"; }
location = /winds-trail/                    { return 302 "/genres#woodwindsBrassBands"; }
location = /choral-vocal-arts-trail/        { return 302 "/genres#voiceSpeechArts"; }
location = /speech-dramatic-arts-trail/     { return 302 "/genres#voiceSpeechArts"; }
location = /strings-classical-guitar-trail/ { return 302 "/genres#strings"; }

# Registration forms and payment pages → /registration
# (registration and payment now happen in outside apps, linked from that page)
location = /payment-options/                     { return 302 /registration; }
location = /payment-incomplete/                  { return 302 /registration; }
location = /payment-complete/                    { return 302 /registration; }
location = /nelson-payment/                      { return 302 /registration; }
location = /music-google-form/                   { return 302 /registration; }
location = /2024wp_register/                     { return 302 /registration; }
location = /dance-form/                          { return 302 /registration; }
location = /dance-registration-trail-2025/       { return 302 /registration; }
location = /dance-solo-modern/                   { return 302 /registration; }
location = /dance-solo-modern-2/                 { return 302 /registration; }
location = /dance-solo-ballet/                   { return 302 /registration; }
location = /dance-solo-stage/                    { return 302 /registration; }
location = /dance-duo-trio-reg/                  { return 302 /registration; }
location = /dance-group-trail/                   { return 302 /registration; }
location = /nelson-dance-solo-stage/             { return 302 /registration; }
location = /nelson-dance-duo-trio/               { return 302 /registration; }
location = /nelson-dance-group/                  { return 302 /registration; }
location = /piano-trail-2023/                    { return 302 /registration; }
location = /piano-trail-duo-trio/                { return 302 /registration; }
location = /trail-piano-2/                       { return 302 /registration; }
location = /2026-piano-duo/                      { return 302 /registration; }
location = /2026-piano-nelson/                   { return 302 /registration; }
location = /piano-solo-nelson-2026/              { return 302 /registration; }
location = /strings-solo/                        { return 302 /registration; }
location = /trail-strings-duo-trio-ensemble/     { return 302 /registration; }
location = /2026-nelson-stringsguitar/           { return 302 /registration; }
location = /2026-nelson-strings-guitar/          { return 302 /registration; }
location = /2026-solo-strings-guitarreg/         { return 302 /registration; }
location = /woodwindssolo/                       { return 302 /registration; }
location = /woodwindsolo-reg-form/               { return 302 /registration; }
location = /trail-woodwinds-group-registration/  { return 302 /registration; }
location = /2026-nelson-winds/                   { return 302 /registration; }
location = /2024-nelson-winds-group/             { return 302 /registration; }
location = /nelson-bands-2026/                   { return 302 /registration; }
location = /trail-vocal-arts-solo/               { return 302 /registration; }
location = /trail-vocal-arts-group-reg/          { return 302 /registration; }
location = /2026-vocal-arts-registration/        { return 302 /registration; }
location = /2026-nelson-vocal-arts-solo/         { return 302 /registration; }
location = /2026-nelson-choral-and-vocal-arts/   { return 302 /registration; }
location = /2026-nelson-speech-dramatic-arts/    { return 302 /registration; }

# Old WordPress sitemap → new sitemap
location = /wp-sitemap.xml { return 302 /sitemap.xml; }

# -----------------------------------------------------------------------------
# 3. Housekeeping
# -----------------------------------------------------------------------------

# Don't serve repo-only files (notes, Python helper scripts, deploy config)
location ~ \.(py|md|conf)$ { return 404; }
location ^~ /deploy/       { return 404; }
location ^~ /.git          { return 404; }

# Everything else: serve the file if it exists, otherwise 404
location / {
    try_files $uri $uri/ =404;
}
